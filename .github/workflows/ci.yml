name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 무엇이 바뀌었는지 먼저 판단한다 ──────────────────────────
  # 관리자만 고쳤는데 공개 사이트를 다시 빌드할 이유가 없다.
  changes:
    name: 변경 범위 판단
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            # ★ admin 은 아직 스캐폴딩 전이다 (.env.example 과 README 뿐).
            #   ci.yml 을 필터에 넣어두면 워크플로만 고쳐도 admin 잡이
            #   package.json 없이 npm ci 를 돌리다 실패한다.
            #   Vite 스캐폴딩이 올라올 때 web 과 같은 형태로 되돌린다.
            admin:
              - 'admin/**'

  # ── 시크릿 스캔 ───────────────────────────────────────────────
  # pre-commit 훅은 --no-verify 로 우회될 수 있다. CI 에서 한 번 더 본다.
  # 훅과 CI 는 서로의 백업이다.
  secrets:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── 공개 사이트 ───────────────────────────────────────────────
  web:
    name: web 빌드
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.gymleco.co.kr

      # 기획서 §3.4-5 — JS 없이도 텍스트가 DOM 에 존재해야 한다.
      # 회귀하면 SEO 와 접근성이 함께 무너지므로 CI 에서 지킨다.
      #
      # ★ 단순 grep 으로는 검증되지 않는다.
      #   Next.js 는 RSC 페이로드를 <script> 안에 직렬화해 넣기 때문에,
      #   화면에 아무것도 안 나와도 grep 은 문자열을 찾아낸다.
      #   실제로 useSearchParams 때문에 /products 가 빈 껍데기가 됐는데도
      #   grep 검사는 통과했다. 반드시 script 를 걷어내고 봐야 한다.
      - name: 프리렌더 HTML 에 실제 본문이 있는지 확인
        run: |
          python3 - <<'PY'
          import pathlib, re, html, sys

          EXPECTED = {
              "index":               ["파워 랙", "무료 시연"],
              "products":            ["제품 라인업", "파워 랙", "설치 면적"],
              "products/power-rack": ["파워 랙", "설치 면적"],
              "used":                ["중고 기구", "상태 등급"],
              "parts":               ["부품"],
              "accessories":         ["악세사리"],
              "centers":             ["공식 헬스장"],
              "news":                ["소식"],
              "about":               ["스웨덴"],
              "contact":             ["개인정보 수집", "(필수)", "(선택)"],
              "privacy":             ["보유 및 이용 기간"],
          }
          # 본문이 이보다 적으면 셸만 렌더된 것으로 본다
          MIN_WORDS = 60

          def visible(path):
              t = path.read_text(encoding="utf-8", errors="ignore")
              t = re.sub(r"<script\b.*?</script>", " ", t, flags=re.S | re.I)
              t = re.sub(r"<style\b.*?</style>", " ", t, flags=re.S | re.I)
              return html.unescape(re.sub(r"<[^>]+>", " ", t))

          base = pathlib.Path(".next/server/app")
          failed = False
          for name, needles in EXPECTED.items():
              f = base / f"{name}.html"
              if not f.exists():
                  print(f"::error::{name} 이 정적 생성되지 않았습니다")
                  failed = True
                  continue
              text = visible(f)
              words = len(text.split())
              if words < MIN_WORDS:
                  print(f"::error::{name} 본문이 {words}단어뿐입니다 — 클라이언트 전용 렌더로 빠졌을 수 있습니다")
                  failed = True
              for n in needles:
                  if n not in text:
                      print(f"::error::{name} 본문에 '{n}' 이 없습니다")
                      failed = True
              if not failed:
                  print(f"  OK  {name} ({words} words)")

          sys.exit(1 if failed else 0)
          PY

  # ── 관리자 SPA ────────────────────────────────────────────────
  admin:
    name: admin 빌드
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
